name: Scrape Fincaraiz

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 6 hours (at 0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read  # The scraped files go to Databricks, not to the repository

jobs:
  scrape:
    # One job per search (config.yaml), all in parallel. The steps are in scrape.yml.
    uses: ./.github/workflows/scrape.yml
    with:
      command: scrape
      targets: >-
        ["fincaraiz-bogota-leasing", "fincaraiz-medellin-leasing",
         "fincaraiz-envigado-leasing", "fincaraiz-sabaneta-leasing",
         "fincaraiz-bogota-sale", "fincaraiz-medellin-sale",
         "fincaraiz-envigado-sale", "fincaraiz-sabaneta-sale"]
      upload: '*_details_*.csv'  # only details files feed the pipeline
      volume: /Volumes/workspace/inmuebles/csv_diarios
      playwright: true
      timeout-minutes: 30
    secrets: inherit
