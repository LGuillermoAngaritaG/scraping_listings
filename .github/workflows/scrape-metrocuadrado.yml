name: Scrape Metrocuadrado

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 8 hours (at 0:00, 8:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read  # The scraped files go to Databricks, not to the repository

jobs:
  scrape:
    # One job per search (config.yaml), all in parallel. The steps are in scrape.yml.
    uses: ./.github/workflows/scrape.yml
    with:
      command: scrape
      targets: >-
        ["metrocuadrado-bogota-leasing", "metrocuadrado-medellin-leasing",
         "metrocuadrado-envigado-leasing", "metrocuadrado-sabaneta-leasing",
         "metrocuadrado-bogota-sale", "metrocuadrado-medellin-sale",
         "metrocuadrado-envigado-sale", "metrocuadrado-sabaneta-sale"]
      upload: '*_details_*.csv'  # only details files feed the pipeline
      volume: /Volumes/workspace/inmuebles/csv_diarios
      playwright: true
      timeout-minutes: 45
    secrets: inherit
