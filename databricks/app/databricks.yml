# Separate bundle for the Streamlit app. Deploy it after the first rent, sale and
# vehicle training runs and the first daily scoring, because they create the serving
# endpoints, the car model and the predictions tables it uses.
bundle:
  name: inmuebles-app

variables:
  endpoint_name:
    default: rent-price
  listings_table:
    default: workspace.inmuebles.gold_rent_listings
  predictions_table:
    default: workspace.inmuebles.rent_predictions
  sale_endpoint_name:
    default: sale-price
  sale_listings_table:
    default: workspace.inmuebles.gold_sale_listings
  sale_predictions_table:
    default: workspace.inmuebles.sale_predictions
  vehicle_model_name:
    default: workspace.inmuebles.vehicle_price_model
  vehicle_listings_table:
    default: workspace.inmuebles.gold_vehicle_listings
  vehicle_predictions_table:
    default: workspace.inmuebles.vehicle_predictions
  warehouse_id:
    lookup:
      warehouse: Serverless Starter Warehouse
  # The training experiment (inmuebles-rent-price) of the main bundle. Find yours with:
  # databricks experiments get-by-name /Users/<you>/inmuebles-rent-price
  experiment_id:
    default: "4097044437851749"

resources:
  apps:
    rent_price_app:
      name: rent-price-app
      description: Estimate the rent or sale price of a property in Bogota, Medellin, Envigado or Sabaneta, or the price of a used car.
      source_code_path: ./src
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.endpoint_name}
            permission: CAN_QUERY
        # Read access for the neighborhood list, the estratos and the similar listings.
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: listings-table
          uc_securable:
            securable_full_name: ${var.listings_table}
            securable_type: TABLE
            permission: SELECT
        # The daily good-deal flags for the similar listings.
        - name: predictions-table
          uc_securable:
            securable_full_name: ${var.predictions_table}
            securable_type: TABLE
            permission: SELECT
        # The same three for sales.
        - name: sale-serving-endpoint
          serving_endpoint:
            name: ${var.sale_endpoint_name}
            permission: CAN_QUERY
        - name: sale-listings-table
          uc_securable:
            securable_full_name: ${var.sale_listings_table}
            securable_type: TABLE
            permission: SELECT
        - name: sale-predictions-table
          uc_securable:
            securable_full_name: ${var.sale_predictions_table}
            securable_type: TABLE
            permission: SELECT
        # Used cars. Free Edition allows two serving endpoints, both used by the property models, so
        # the app loads the car model itself. Unity Catalog grants on a registered model use the
        # FUNCTION type: EXECUTE lets the app download the model.
        - name: vehicle-model
          uc_securable:
            securable_full_name: ${var.vehicle_model_name}
            securable_type: FUNCTION
            permission: EXECUTE
        - name: vehicle-listings-table
          uc_securable:
            securable_full_name: ${var.vehicle_listings_table}
            securable_type: TABLE
            permission: SELECT
        - name: vehicle-predictions-table
          uc_securable:
            securable_full_name: ${var.vehicle_predictions_table}
            securable_type: TABLE
            permission: SELECT
        # Read the training runs for the "How it was built" tab.
        - name: experiment
          experiment:
            experiment_id: ${var.experiment_id}
            permission: CAN_READ

targets:
  free:
    default: true
