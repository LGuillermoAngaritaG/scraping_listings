command: ["streamlit", "run", "app.py"]
env:
  - name: SERVING_ENDPOINT
    valueFrom: serving-endpoint
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LISTINGS_TABLE
    valueFrom: listings-table
  - name: PREDICTIONS_TABLE
    valueFrom: predictions-table
  - name: SALE_SERVING_ENDPOINT
    valueFrom: sale-serving-endpoint
  - name: SALE_LISTINGS_TABLE
    valueFrom: sale-listings-table
  - name: SALE_PREDICTIONS_TABLE
    valueFrom: sale-predictions-table
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
  - name: VEHICLE_MODEL
    valueFrom: vehicle-model
  - name: VEHICLE_LISTINGS_TABLE
    valueFrom: vehicle-listings-table
  - name: VEHICLE_PREDICTIONS_TABLE
    valueFrom: vehicle-predictions-table
