[project]
name = "price-estimator-app"
version = "0.1.0"
description = "Streamlit app: property and used-car price estimates."
# uv, not requirements.txt: the car model is loaded in the app (Free Edition allows two
# serving endpoints, both in use) and needs Python 3.12 and the versions it was trained with.
requires-python = "==3.12.*"
dependencies = [
    "streamlit>=1.67",
    "databricks-sdk>=0.60",
    # Same versions as training (train.py PIP_REQUIREMENTS, serverless environment 6).
    "mlflow-skinny==3.18.0",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "xgboost==3.4.1",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "numpy==2.3.4",
    "cloudpickle==3.1.1",
]
