# Local test environment for the Databricks bundle. Not deployed.
[project]
name = "inmuebles-databricks"
version = "0.1.0"
description = "Local tests for the Databricks pipeline transforms and model code."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyspark>=4.0",
    "pytest>=8.0",
    "pandas>=2.2,<3",  # same major version as Databricks serverless
    "pyarrow>=18",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/pipeline", "src/ml"]
