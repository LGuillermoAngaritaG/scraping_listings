resources:
  schemas:
    inmuebles:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Bogota rental listings scraped from Fincaraiz and Metrocuadrado.

  volumes:
    csv_diarios:
      name: csv_diarios
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.inmuebles.name}
      volume_type: MANAGED
      comment: Raw scraper CSV files uploaded by the GitHub Actions.

    reference:
      name: reference
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.inmuebles.name}
      volume_type: MANAGED
      comment: Public map data for the neighborhood map (Bogota barrios, OpenStreetMap places). Uploaded by hand.

    csv_vehiculos:
      name: csv_vehiculos
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.inmuebles.name}
      volume_type: MANAGED
      comment: Raw used-car CSV files from the dealer scrapers, uploaded by the GitHub Action.

  experiments:
    rent_price:
      name: /Workspace/Users/${workspace.current_user.userName}/inmuebles-rent-price
