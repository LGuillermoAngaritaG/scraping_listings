[project]
name = "scraping-listings"
version = "1.0.0"
description = "Scrapers for property listings and used cars in Colombia"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core scraping
    "scrapy>=2.11.0",
    "playwright>=1.40.0",
    "requests>=2.31.0",
    "parsel>=1.8",  # used directly by the car scrapers
    # Configuration
    "pyyaml>=6.0.1",
    "pydantic>=2.12.2",
    "crochet>=2.0.0",
    "pandas>=2.1.0",
]

[project.scripts]
scrape = "scraping_listings.main:main"
scrape-vehicles = "scraping_listings.vehicles.cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraping_listings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B011"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]
